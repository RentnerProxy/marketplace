[package]
name = "marketplace-tooling"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
regex = "1.13"
rentnerproxy-artifacts = "1.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
tar = { version = "0.4", default-features = false }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
