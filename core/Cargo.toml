[package]
name = "marketplace-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
members = [
    "app-catalog",
    "app-contracts",
    "app-pipeline",
    "artifacts",
    "ffi",
    "tooling",
]
default-members = [".", "app-contracts"]
resolver = "3"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
base64 = "0.23.1"
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.1"
unicode-normalization = "0.1"
getrandom = "0.4.3"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
subtle = "2.6"
zeroize = "1.9"
aead-gcm-stream = "0.4.1"
# Keep AES compatible with aead-gcm-stream's cipher 0.4 traits.
aes = { version = "0.8", features = ["zeroize"] }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
url = "2.5.9"
uuid = { version = "1", features = ["v4"] }
regex-lite = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.ffi]
inherits = "release"
panic = "unwind"
