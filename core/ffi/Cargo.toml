[package]
name = "marketplace-storage-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "marketplace_storage"
crate-type = ["cdylib"]

[dependencies]
marketplace-core = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
