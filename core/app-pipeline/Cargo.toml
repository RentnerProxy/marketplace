[package]
name = "marketplace-app-pipeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "marketplace-app-pipeline"

[features]
default = ["pipeline"]
pipeline = ["rentnerproxy-app-pipeline/pipeline"]
smoke-probe = []

[[bin]]
name = "marketplace-app-pipeline"
path = "src/main.rs"
required-features = ["pipeline"]

[[bin]]
name = "candidate-smoke"
path = "src/bin/candidate-smoke.rs"
required-features = ["smoke-probe"]

[dependencies]
# Without the pipeline feature the SDK builds only its smoke module for the static probe binary.
rentnerproxy-app-pipeline = { version = "1.1.0", default-features = false }
rentnerproxy-artifacts = "1.1.0"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
