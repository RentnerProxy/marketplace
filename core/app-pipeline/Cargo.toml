[package]
name = "marketplace-app-pipeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "marketplace-app-pipeline"

[features]
default = ["pipeline"]
pipeline = [
    "dep:getrandom",
    "dep:hex",
    "dep:regex",
    "dep:rustix",
    "dep:time",
    "dep:uuid",
    "dep:windows-sys",
    "dep:zstd",
]
smoke-probe = []

[[bin]]
name = "marketplace-app-pipeline"
path = "src/main.rs"
required-features = ["pipeline"]

[[bin]]
name = "candidate-smoke"
path = "src/bin/candidate-smoke.rs"
required-features = ["smoke-probe"]

[dependencies]
getrandom = { version = "0.4.3", optional = true }
hex = { version = "0.4.3", optional = true }
marketplace-artifacts = { path = "../artifacts" }
regex = { version = "1.13", optional = true }
rentnerproxy-app-contracts = { path = "../app-contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11.1"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
zstd = { version = "0.13.4", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
httparse = "1.10"
libc = "0.2.191"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.6", features = ["fs"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"], optional = true }

[dev-dependencies]
httparse = "1.10"
