[package]
name = "marketplace-app-pipeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
getrandom = "0.4.3"
hex = "0.4.3"
marketplace-artifacts = { path = "../artifacts" }
regex = "1.13"
rentnerproxy-app-contracts = { path = "../app-contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
zstd = { version = "0.13.4", default-features = false }

[target.'cfg(unix)'.dependencies]
httparse = "1.10"
libc = "0.2.191"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
httparse = "1.10"
