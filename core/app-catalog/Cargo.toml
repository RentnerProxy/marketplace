[package]
name = "marketplace-app-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
ed25519-dalek = { version = "2.2", features = ["pem"] }
hex = "0.4.3"
marketplace-artifacts = { path = "../artifacts" }
olpc-cjson = "0.1.4"
rentnerproxy-app-contracts = { path = "../app-contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
zip = { version = "9.7.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
zeroize = "1.9"
