changelog:
    exclude:
        labels: [duplicate, invalid, wontfix]
    categories:
        - title: '🔒 Security'
          labels: [security]
        - title: '✨ New Features'
          labels: [enhancement]
        - title: '🐛 Bug Fixes'
          labels: [bug]
        - title: '📦 Dependencies'
          labels: [dependencies]
        - title: '🧪 Tests & CI'
          labels: ['area: automation', github-actions]
        - title: '📚 Documentation'
          labels: [documentation]
        - title: '🛠 Other Changes'
          labels: ['*']
