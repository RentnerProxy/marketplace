name: Release
on:
    push:
        tags: ['v*']
permissions:
    contents: read
concurrency:
    group: marketplace-release
    cancel-in-progress: false
jobs:
    content:
        name: Validate release changelog
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4
            - name: Validate exact official tag
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bash .github/scripts/release/validate-tag.sh
            - name: Require authored published changelog before release builds
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bun --no-env-file .github/scripts/release/release-blog.ts
    announce:
        name: Announce release build
        needs: content
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4
            - name: Validate exact official tag
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bash .github/scripts/release/validate-tag.sh
            - name: Show building banner until the tested image is ready
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bun --no-env-file .github/scripts/release/publish-release.ts building
    verify:
        needs: announce
        uses: ./.github/workflows/ci.yml
    publish:
        name: Publish tested appliance
        needs: verify
        environment: marketplace-release
        outputs:
            image: ${{ steps.publish.outputs.image }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4
            - name: Validate release identity
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bash .github/scripts/release/validate-tag.sh
            - name: Revalidate release changelog before image build
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bun --no-env-file .github/scripts/release/release-blog.ts
            - name: Validate minimal Compose contract
              env:
                  ORIGIN: http://localhost:6600
                  POSTGRES_PASSWORD: isolated-compose-fixture
                  AUTH_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
              run: docker compose --env-file .env.example config --no-env-resolution --quiet
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
            - name: Build complete appliance
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
              with:
                  context: .
                  file: ./Dockerfile
                  target: production
                  push: false
                  load: true
                  tags: marketplace-ci:test
                  build-args: APP_VERSION=${{ github.ref_name }}
            - name: Install checksum-verified image scanner
              run: bash .github/scripts/security/install-trivy.sh
            - name: Scan the exact built appliance for vulnerabilities
              env:
                  IMAGE_ID: ${{ steps.build.outputs.imageid }}
                  TRIVY_BINARY: ${{ runner.temp }}/trivy
              run: bash .github/scripts/security/scan-image.sh "$IMAGE_ID"
            - name: Verify isolated appliance startup, recovery and cleanup
              env:
                  RUNTIME_IMAGE_ID: ${{ steps.build.outputs.imageid }}
              run: bun --no-env-file run test:deployment
            - name: Verify native TypeScript and Rust contracts
              run: bash .github/scripts/ci/core-integration.sh
            - name: Publish tested image
              id: publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  REGISTRY_ACTOR: ${{ github.actor }}
                  RELEASE_TAG: ${{ github.ref_name }}
                  IMAGE_ID: ${{ steps.build.outputs.imageid }}
              run: bash .github/scripts/release/publish-image.sh
    notes:
        name: Publish GitHub Release
        needs: publish
        environment: marketplace-release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4
            - name: Verify exact official tag
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bash .github/scripts/release/validate-tag.sh
            - name: Prepare release notes and downloadable changelog
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
                  RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
              run: bun --no-env-file .github/scripts/release/publish-release.ts prepare
            - name: Publish downloadable changelog
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bash .github/scripts/release/publish-changelog.sh
            - name: Replace building status with the completed release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
                  RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
              run: bun --no-env-file .github/scripts/release/publish-release.ts
    failed:
        name: Report interrupted release build
        needs: [content, announce, verify, publish, notes]
        if: ${{ always() && needs.announce.result == 'success' && (contains(fromJSON('["failure","cancelled"]'), needs.verify.result) || contains(fromJSON('["failure","cancelled"]'), needs.publish.result) || contains(fromJSON('["failure","cancelled"]'), needs.notes.result)) }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4
            - name: Validate exact official tag
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bash .github/scripts/release/validate-tag.sh
            - name: Keep an honest failure status until a successful retry
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bun --no-env-file .github/scripts/release/publish-release.ts failed
