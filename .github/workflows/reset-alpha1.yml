name: Reset original broken Alpha1
on:
    workflow_dispatch:
permissions: {}
concurrency:
    group: marketplace-release
    cancel-in-progress: false
jobs:
    reset:
        if: github.repository == 'RentnerProxy/marketplace' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        environment: container-publishing
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.5
            - name: Validate all identities and remove only original broken resources
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun --no-env-file .github/scripts/release/reset-alpha1.ts
