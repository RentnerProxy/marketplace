name: CI
on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
    cancel-in-progress: true
env:
    BUN_VERSION: 1.4.5
    RUST_VERSION: 1.100.0
jobs:
    typescript:
        name: TypeScript
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - uses: ./.github/actions/native-tools
              with:
                  package-set: all
            - run: bun ci --linker=isolated
              env:
                  BUN_FEATURE_FLAG_DISABLE_NATIVE_DEPENDENCY_LINKER: '1'
            - run: bun --no-env-file run project:check
            - run: bun --no-env-file run typecheck
            - run: bun --no-env-file x tsc --noEmit --project tsconfig.github.json
            - run: bun --no-env-file run lint
            - run: bun --no-env-file run test
            - run: bun --no-env-file run build
    rust:
        name: Rust
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: core
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy,llvm-tools-preview
            - run: cargo fmt --all -- --check
            - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
            - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun --no-env-file ci --linker=isolated --ignore-scripts
              working-directory: .
              env:
                  BUN_FEATURE_FLAG_DISABLE_NATIVE_DEPENDENCY_LINKER: '1'
            - name: Measure Rust coverage through native and adapter tests
              working-directory: .
              run: bun --no-env-file run core:coverage
            - run: cargo build --locked --release --workspace --bins
            - name: Verify the publisher with the release-profile catalog core
              working-directory: .
              run: bun --no-env-file run test:catalog-integration
    database:
        name: PostgreSQL
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                # Keep the service on the appliance PostgreSQL image from the Dockerfile.
                image: postgres:18.7-alpine3.24
                env:
                    POSTGRES_DB: marketplace_test
                    POSTGRES_HOST_AUTH_METHOD: trust
                ports:
                    - 127.0.0.1:5432:5432
                options: >-
                    --health-cmd "pg_isready --host 127.0.0.1 --username postgres --dbname marketplace_test"
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 30
        env:
            TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/marketplace_test
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - uses: ./.github/actions/native-tools
              with:
                  package-set: all
            - run: bun --no-env-file ci --linker=isolated
              env:
                  BUN_FEATURE_FLAG_DISABLE_NATIVE_DEPENDENCY_LINKER: '1'
            - name: Migrate the isolated PostgreSQL test database
              run: bun --no-env-file run test:db:prepare
            - name: Run the PostgreSQL integration tests
              run: bun --no-env-file run test:db
    image:
        name: Appliance
        uses: ./.github/workflows/image.yml
