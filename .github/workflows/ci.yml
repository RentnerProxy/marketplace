name: CI
on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
    cancel-in-progress: true
env:
    BUN_VERSION: 1.4.4
    RUST_VERSION: 1.99.1
jobs:
    typescript:
        name: TypeScript
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun ci --linker=isolated
              env:
                  BUN_FEATURE_FLAG_DISABLE_NATIVE_DEPENDENCY_LINKER: '1'
            - run: bun --no-env-file run project:check
            - run: bun --no-env-file run typecheck
            - run: bun --no-env-file x tsc --noEmit --project tsconfig.github.json
            - run: bun --no-env-file run lint
            - run: bun --no-env-file run test
            - run: bun --no-env-file run build
    rust:
        name: Rust
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: core
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy,llvm-tools-preview
            - run: cargo fmt --all -- --check
            - run: cargo clippy --locked --all-targets --all-features -- -D warnings
            - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
            - run: cargo llvm-cov --locked --all-targets --all-features --fail-under-lines 90 --fail-under-functions 90
            - run: cargo build --locked --release --bins
    image:
        name: Appliance
        uses: ./.github/workflows/image.yml
