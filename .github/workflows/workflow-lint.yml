name: Workflow Lint
on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    lint:
        name: Workflow Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4
            - uses: ./.github/actions/native-tools
              with:
                  package-set: tooling
            - name: Install actionlint
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: bash .github/scripts/ci/install-actionlint.sh
            - run: '"$RUNNER_TEMP/actionlint" -color'
            - run: find .github/scripts -type f -name '*.sh' -print0 | xargs -0 -- shellcheck
            - run: bun --no-env-file .github/scripts/ci/workflow-policy.ts
            - run: bun --no-env-file fmt --check .github tsconfig.github.json
