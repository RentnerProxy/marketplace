name: Appliance Image
on:
    workflow_call:
permissions:
    contents: read
jobs:
    image:
        name: Image and isolated lifecycle
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - &checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - &bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.5
            - &native-tools
              uses: ./.github/actions/native-tools
              with:
                  package-set: tooling
            - name: Validate minimal Compose contract
              env:
                  ORIGIN: http://localhost:6600
                  POSTGRES_PASSWORD: isolated-compose-fixture
                  AUTH_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
              run: docker compose --env-file .env.example config --no-env-resolution --quiet
            - &buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
            - &build
              name: Build complete appliance
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
              with:
                  context: .
                  file: ./Dockerfile
                  target: production
                  push: false
                  load: true
                  tags: marketplace-ci:test
                  build-args: APP_VERSION=ci-test
            - &storage-abi
              name: Verify the native storage ABI from the runtime config
              env:
                  RUNTIME_IMAGE_ID: ${{ steps.build.outputs.imageid }}
              run: bash .github/scripts/ci/verify-storage-abi.sh
            - name: Install checksum-verified image scanner
              run: bash .github/scripts/security/install-trivy.sh
            - name: Scan the exact built appliance for vulnerabilities
              env:
                  IMAGE_ID: ${{ steps.build.outputs.imageid }}
                  TRIVY_BINARY: ${{ runner.temp }}/trivy
              run: bash .github/scripts/security/scan-image.sh "$IMAGE_ID"
            - name: Verify OCI scanner compatibility with the built appliance
              env:
                  IMAGE_ID: ${{ steps.build.outputs.imageid }}
                  TRIVY_BINARY: ${{ runner.temp }}/trivy
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends skopeo umoci
                  bash .github/scripts/ci/verify-oci-scan.sh
            - &previous-checkout
              name: Check out the package-based Marketplace baseline
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: 42c76fbc18f984158e0f9c9427498373792e6600
                  path: .tools/postgres-apk-appliance
                  persist-credentials: false
            - &previous-build
              name: Build the package-based Marketplace baseline
              id: previous-build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
              with:
                  context: .tools/postgres-apk-appliance
                  file: .tools/postgres-apk-appliance/Dockerfile
                  target: production
                  push: false
                  load: true
                  tags: marketplace-ci:postgres-apk
                  build-args: APP_VERSION=ci-test
            - &lifecycle
              name: Verify isolated appliance startup, recovery and cleanup
              env:
                  RUNTIME_IMAGE_ID: ${{ steps.build.outputs.imageid }}
                  PREVIOUS_RUNTIME_IMAGE_ID: ${{ steps.previous-build.outputs.imageid }}
              run: bun --no-env-file run test:deployment
            - name: Verify native TypeScript and Rust contracts
              run: bash .github/scripts/ci/core-integration.sh
            - name: Verify packaged public assets and English pages
              env:
                  RUNTIME_IMAGE_ID: ${{ steps.build.outputs.imageid }}
              run: bun --no-env-file .github/scripts/ci/public-assets.ts
    arm64:
        name: Image and isolated lifecycle (ARM64)
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 30
        steps:
            - *checkout
            - *bun
            - *native-tools
            - *buildx
            - *build
            - *storage-abi
            - *previous-checkout
            - *previous-build
            - *lifecycle
