name: Gitleaks

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: gitleaks-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    GITLEAKS_VERSION: 8.30.1
    GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Check out trusted policy revision
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: trusted
                  ref: ${{ github.event.pull_request.base.sha || github.sha }}

            # Self-contained installation also works before main contains provider scripts.
            - name: Install checksum-verified Gitleaks
              shell: bash
              run: |
                  set -euo pipefail
                  archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  archive_path="$RUNNER_TEMP/$archive"
                  curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
                      --output "$archive_path" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
                  printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive_path" | sha256sum --check --strict
                  tar -xzf "$archive_path" -C "$RUNNER_TEMP" gitleaks

            - name: Select verified scanner policy
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  SOURCE_REPOSITORY: ${{ github.repository }}
                  TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  [[ "$TRUSTED_SHA" =~ ^[a-f0-9]{40}$ ]]
                  [[ "$(git -C trusted rev-parse HEAD)" == "$TRUSTED_SHA" ]]
                  config_path="$RUNNER_TEMP/gitleaks-verified.toml"
                  if git -C trusted cat-file -e "$TRUSTED_SHA:.gitleaks.toml" 2>/dev/null; then
                      git -C trusted show "$TRUSTED_SHA:.gitleaks.toml" > "$config_path"
                  else
                      # Only the reviewed README-only root commit can bootstrap policy.
                      [[ "$EVENT_NAME" == pull_request ]]
                      [[ "$SOURCE_REPOSITORY" == RentnerProxy/marketplace ]]
                      [[ "$TRUSTED_SHA" == 96b976cd7f3fa606c19678d7f9f02eac0506a110 ]]
                      [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
                      git show "$PR_HEAD_SHA:.gitleaks.toml" > "$config_path"
                      # Exact reviewed policy: defaults plus one rule/path/line fixture exception.
                      printf '%s  %s\n' 4f94464674e89d9981ca773fc8af778f461fd76d5438aca6cc6742a9ee370bf7 "$config_path" | sha256sum --check --strict
                  fi

            - name: Scan commits
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PUSH_BEFORE_SHA: ${{ github.event.before }}
                  PUSH_AFTER_SHA: ${{ github.event.after }}
              shell: bash
              run: |
                  set -euo pipefail
                  valid_sha() { [[ "$1" =~ ^[a-f0-9]{40}$ ]]; }
                  case "$EVENT_NAME" in
                      pull_request)
                          valid_sha "$PR_BASE_SHA" && valid_sha "$PR_HEAD_SHA"
                          scan_log_opts="-m ${PR_BASE_SHA}..${PR_HEAD_SHA}"
                          ;;
                      push)
                          valid_sha "$PUSH_AFTER_SHA"
                          if [[ "$PUSH_BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
                              scan_log_opts="-m $PUSH_AFTER_SHA"
                          else
                              valid_sha "$PUSH_BEFORE_SHA"
                              scan_log_opts="-m ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
                          fi
                          ;;
                      workflow_dispatch) scan_log_opts='-m --all' ;;
                      *) exit 1 ;;
                  esac
                  "$RUNNER_TEMP/gitleaks" git --config="$RUNNER_TEMP/gitleaks-verified.toml" \
                      --gitleaks-ignore-path=/dev/null --redact=100 --no-banner --no-color \
                      --log-opts="$scan_log_opts" .
