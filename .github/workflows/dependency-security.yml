name: Dependency Security
on:
    pull_request:
    push:
        branches: [main]
    schedule:
        - cron: '43 4 * * *'
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
concurrency:
    group: dependencies-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
    cancel-in-progress: true
jobs:
    audit:
        name: Dependency Audit
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4
            - run: bun ci --linker=isolated
              env:
                  BUN_FEATURE_FLAG_DISABLE_NATIVE_DEPENDENCY_LINKER: '1'
            - run: bun --no-env-file audit --audit-level=moderate
            - run: bash .github/scripts/security/install-cargo-audit.sh
            - run: '"$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --file core/Cargo.lock'
